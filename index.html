<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TP Circuits Électriques VR — Mesures Physiques</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <style>
    body { margin: 0; }
    /* Canvas hors écran mais rendus (display:none peut bloquer le rendu sur certains navigateurs) */
    .offscreen-canvas {
      position: absolute;
      left: -9999px;
      top: -9999px;
    }
  </style>
</head>
<body>
<canvas id="oscillo-canvas" class="offscreen-canvas" width="512" height="400"></canvas>
<canvas id="gbf-canvas" class="offscreen-canvas" width="256" height="128"></canvas>

<script>
// ================================================================
// TP CIRCUITS ÉLECTRIQUES VR — Mesures Physiques — FEMTO-ST
// ================================================================
// RÈGLES Quest 3 :
//   1) Pas de création dynamique d'entités — tout en HTML inline
//   2) Pas de tick() sur les entités laser-controls
//   3) Pas d'événements bouton → polling gamepad
//   4) renderer.xr.getSession() au lieu de scene.xrSession
// ================================================================

// ============ LOCOMOTION + GRAB (moteur éprouvé) ============
AFRAME.registerComponent('locomotion', {
  schema: { speed: { default: 2.5 } },
  init: function () {
    this.leftAxis = [0, 0];
    this.rightAxis = [0, 0];
    this.direction = new THREE.Vector3();
    this.rt = new THREE.Vector3();
    this.mv = new THREE.Vector3();
    this._grabL = { held: null, oldParent: null, wasPressed: false, origPos: null, origRot: null };
    this._grabR = { held: null, oldParent: null, wasPressed: false, origPos: null, origRot: null };
    this._prevHL = null;
    this._grabCount = 0;
    this._fc = 0;
    this._dbg = 'Init OK';
    this._err = '';
    this._tmpV = new THREE.Vector3();
    this._tmpW = new THREE.Vector3();
    var self = this;
    setTimeout(function () {
      var lh = document.querySelector('#left-hand');
      var rh = document.querySelector('#right-hand');
      if (lh) lh.addEventListener('thumbstickmoved', function (e) { self.leftAxis = [e.detail.x, e.detail.y]; });
      if (rh) rh.addEventListener('thumbstickmoved', function (e) { self.rightAxis = [e.detail.x, e.detail.y]; });
    }, 2000);
  },
  _findClosest: function (worldPos) {
    var objs = document.querySelectorAll('[grabbable]');
    var closest = null, minD = 1.5;
    var wp = this._tmpW;
    for (var i = 0; i < objs.length; i++) {
      var o = objs[i];
      if (o.getAttribute('data-grabbed')) continue;
      o.object3D.getWorldPosition(wp);
      var dd = worldPos.distanceTo(wp);
      if (dd < minD) { minD = dd; closest = o; }
    }
    return { target: closest, dist: minD };
  },
  _processHand: function (handEl, state, gamepad) {
    var pressed = false;
    var btnInfo = '';
    if (gamepad) {
      try {
        for (var b = 0; b <= 1 && b < gamepad.buttons.length; b++) {
          var btn = gamepad.buttons[b];
          if (btn.pressed || btn.value > 0.5) { pressed = true; btnInfo += (b === 0 ? 'T' : 'G'); }
        }
      } catch (e) { this._err = 'BTN:' + e.message; }
    }
    if (pressed && !state.wasPressed) {
      this._grabCount++;
      var sphere = handEl.querySelector('.hand-sphere');
      if (sphere) sphere.setAttribute('color', '#00ff00');
      if (!state.held) {
        handEl.object3D.getWorldPosition(this._tmpV);
        var res = this._findClosest(this._tmpV);
        if (res.target) {
          state.origPos = res.target.object3D.position.clone();
          state.origRot = res.target.object3D.rotation.clone();
          res.target.setAttribute('data-grabbed', 'true');
          state.held = res.target;
          state.oldParent = res.target.parentNode;
          handEl.object3D.attach(res.target.object3D);
        }
      } else {
        state.oldParent.object3D.attach(state.held.object3D);
        state.held.object3D.position.copy(state.origPos);
        state.held.object3D.rotation.copy(state.origRot);
        state.held.removeAttribute('data-grabbed');
        state.held = null; state.oldParent = null;
      }
    }
    if (!pressed && state.wasPressed) {
      var sphere2 = handEl.querySelector('.hand-sphere');
      var origColor = (handEl.id === 'left-hand') ? '#ff4444' : '#4444ff';
      if (sphere2) sphere2.setAttribute('color', origColor);
      if (state.held) {
        state.oldParent.object3D.attach(state.held.object3D);
        state.held.object3D.position.copy(state.origPos);
        state.held.object3D.rotation.copy(state.origRot);
        state.held.removeAttribute('data-grabbed');
        state.held = null; state.oldParent = null;
      }
    }
    state.wasPressed = pressed;
    return btnInfo;
  },
  tick: function (t, dt) {
    this._fc++;
    var lx = this.leftAxis[0], ly = this.leftAxis[1];
    var rx = this.rightAxis[0], ry = this.rightAxis[1];
    var dz = 0.15;
    if (dt <= 100) {
      var cam = this.el.querySelector('[camera]') || this.el.querySelector('a-camera');
      if (cam && (Math.abs(lx)>dz||Math.abs(ly)>dz||Math.abs(rx)>dz||Math.abs(ry)>dz)) {
        var spd = this.data.speed * dt / 1000;
        this.mv.set(0, 0, 0);
        if (Math.abs(lx)>dz||Math.abs(ly)>dz) {
          cam.object3D.getWorldDirection(this.direction);
          this.direction.y = 0; this.direction.normalize();
          this.rt.crossVectors(this.direction, new THREE.Vector3(0, 1, 0)).normalize();
          this.mv.addScaledVector(this.direction, ly * spd);
          this.mv.addScaledVector(this.rt, -lx * spd);
        }
        if (Math.abs(ry) > dz) this.mv.y += -ry * spd;
        if (Math.abs(rx) > dz) this.el.object3D.rotation.y -= rx * 1.5 * dt / 1000;
        this.el.object3D.position.add(this.mv);
      }
    }
    var gpLeft = null, gpRight = null, gpSource = '';
    try {
      var sceneEl = this.el.sceneEl;
      if (sceneEl && sceneEl.renderer && sceneEl.renderer.xr) {
        var session = sceneEl.renderer.xr.getSession();
        if (session && session.inputSources) {
          for (var j = 0; j < session.inputSources.length; j++) {
            var src = session.inputSources[j];
            if (src.gamepad) {
              if (src.handedness === 'left') gpLeft = src.gamepad;
              if (src.handedness === 'right') gpRight = src.gamepad;
            }
          }
          gpSource = 'XR:' + session.inputSources.length;
        }
      }
    } catch (e) { this._err = 'XR:' + e.message; }
    if (!gpLeft && !gpRight) {
      try {
        var gps = navigator.getGamepads ? navigator.getGamepads() : null;
        if (gps) {
          var found = [];
          for (var m = 0; m < gps.length; m++) { if (gps[m]) found.push(gps[m]); }
          if (found.length >= 2) { gpLeft = found[0]; gpRight = found[1]; }
          else if (found.length === 1) gpRight = found[0];
        }
      } catch (e) {}
    }
    var leftHand = document.querySelector('#left-hand');
    var rightHand = document.querySelector('#right-hand');
    var btnL = '', btnR = '';
    if (leftHand) btnL = this._processHand(leftHand, this._grabL, gpLeft);
    if (rightHand) btnR = this._processHand(rightHand, this._grabR, gpRight);
    try {
      if (!this._grabR.held && rightHand) {
        rightHand.object3D.getWorldPosition(this._tmpV);
        var r2 = this._findClosest(this._tmpV);
        if (this._prevHL && this._prevHL !== r2.target) {
          var hb = this._prevHL.querySelector('.interactive');
          if (hb) hb.setAttribute('material', 'opacity: 0.05; transparent: true; side: double');
        }
        if (r2.target) {
          var hb2 = r2.target.querySelector('.interactive');
          if (hb2) hb2.setAttribute('material', 'opacity: 0.15; transparent: true; color: #88ffaa; side: double');
        }
        this._prevHL = r2.target;
      }
    } catch (e) {}
    if (this._fc % 30 === 0) {
      try {
        var d = document.querySelector('#debug-text');
        if (d) {
          d.setAttribute('value', gpSource + ' Btn:' + (btnL||'-') + '/' + (btnR||'-') + ' G:' + this._grabCount + (this._err ? '\n' + this._err : ''));
        }
      } catch (e) {}
    }
  }
});

AFRAME.registerComponent('grabbable', { init: function () { this.el.classList.add('grabbable'); } });

// ============ SIMULATION CIRCUIT RC ============
AFRAME.registerComponent('circuit-sim', {
  init: function () {
    this.R = 1000;
    this.C = 100e-9;
    this.freq = 500;
    this.amplitude = 5;
    this.fc = 1 / (2 * Math.PI * this.R * this.C);

    this.oscCanvas = document.getElementById('oscillo-canvas');
    this.oscCtx = this.oscCanvas.getContext('2d');
    this.gbfCanvas = document.getElementById('gbf-canvas');
    this.gbfCtx = this.gbfCanvas.getContext('2d');

    this.oscTexture = null;
    this.gbfTexture = null;
    this._fc = 0;
    this._oscReady = false;
    this._gbfReady = false;

    // Dessiner immédiatement sur les canvas
    this._drawOscilloscope();
    this._drawGBF();
  },

  _trySetupOsc: function () {
    var el = document.querySelector('#oscillo-screen');
    if (!el) return;
    var mesh = el.getObject3D('mesh');
    if (!mesh) return;
    this.oscTexture = new THREE.CanvasTexture(this.oscCanvas);
    this.oscTexture.needsUpdate = true;
    mesh.material = new THREE.MeshBasicMaterial({ map: this.oscTexture });
    mesh.material.needsUpdate = true;
    this._oscReady = true;
  },

  _trySetupGbf: function () {
    var el = document.querySelector('#gbf-screen');
    if (!el) return;
    var mesh = el.getObject3D('mesh');
    if (!mesh) return;
    this.gbfTexture = new THREE.CanvasTexture(this.gbfCanvas);
    this.gbfTexture.needsUpdate = true;
    mesh.material = new THREE.MeshBasicMaterial({ map: this.gbfTexture });
    mesh.material.needsUpdate = true;
    this._gbfReady = true;
  },

  tick: function (t, dt) {
    this._fc++;

    // Essayer de setup les textures (réessaye chaque seconde jusqu'à succès)
    if (!this._oscReady && this._fc % 60 === 30) this._trySetupOsc();
    if (!this._gbfReady && this._fc % 60 === 35) this._trySetupGbf();

    // Interaction boutons GBF
    var rig = document.querySelector('#rig');
    if (rig && rig.components.locomotion) {
      var loc = rig.components.locomotion;

      var freqKnob = document.querySelector('#freq-knob');
      if (freqKnob && freqKnob.getAttribute('data-grabbed')) {
        var ly = loc.leftAxis[1];
        if (Math.abs(ly) > 0.15) {
          this.freq = Math.max(10, Math.min(100000, this.freq * (1 + ly * 0.04)));
        }
      }

      var ampKnob = document.querySelector('#amp-knob');
      if (ampKnob && ampKnob.getAttribute('data-grabbed')) {
        var ly2 = loc.leftAxis[1];
        if (Math.abs(ly2) > 0.15) {
          this.amplitude = Math.max(0.1, Math.min(10, this.amplitude + ly2 * 0.05));
        }
      }
    }

    // Mise à jour affichage tous les 3 frames
    if (this._fc % 3 === 0) {
      this._drawOscilloscope();
      this._drawGBF();
      if (this.oscTexture) this.oscTexture.needsUpdate = true;
      if (this.gbfTexture) this.gbfTexture.needsUpdate = true;
    }

    // Mise à jour label fréquence flottant
    if (this._fc % 10 === 0) {
      var fl = document.querySelector('#freq-label');
      if (fl) fl.setAttribute('value', this._fmtF(this.freq));
      var al = document.querySelector('#amp-label');
      if (al) al.setAttribute('value', this.amplitude.toFixed(1) + ' V');
    }
  },

  _drawOscilloscope: function () {
    var ctx = this.oscCtx;
    var W = 512, H = 400;
    var f = this.freq, A = this.amplitude;
    var RC = this.R * this.C;
    var w = 2 * Math.PI * f;

    var gain = 1 / Math.sqrt(1 + Math.pow(w * RC, 2));
    var phase = -Math.atan(w * RC);
    var Aout = A * gain;

    // Fond
    ctx.fillStyle = '#081208';
    ctx.fillRect(0, 0, W, H);

    // Grille fine
    var divX = 10, divY = 8;
    var dx = W / divX, dy = H / divY;
    ctx.strokeStyle = '#1a2e1a';
    ctx.lineWidth = 0.5;
    for (var i = 1; i < divX; i++) {
      ctx.beginPath(); ctx.moveTo(i * dx, 0); ctx.lineTo(i * dx, H); ctx.stroke();
    }
    for (var j = 1; j < divY; j++) {
      ctx.beginPath(); ctx.moveTo(0, j * dy); ctx.lineTo(W, j * dy); ctx.stroke();
    }
    // Axes centraux
    ctx.strokeStyle = '#2a5a2a';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H); ctx.stroke();

    // Graduations sur les axes
    ctx.strokeStyle = '#3a7a3a';
    ctx.lineWidth = 1;
    for (var g = 0; g <= divX; g++) {
      for (var sg = 1; sg < 5; sg++) {
        var gx = g * dx + sg * dx / 5;
        if (gx < W) {
          ctx.beginPath(); ctx.moveTo(gx, H / 2 - 4); ctx.lineTo(gx, H / 2 + 4); ctx.stroke();
        }
      }
    }
    for (var g2 = 0; g2 <= divY; g2++) {
      for (var sg2 = 1; sg2 < 5; sg2++) {
        var gy = g2 * dy + sg2 * dy / 5;
        if (gy < H) {
          ctx.beginPath(); ctx.moveTo(W / 2 - 4, gy); ctx.lineTo(W / 2 + 4, gy); ctx.stroke();
        }
      }
    }

    // Échelle auto
    var period = 1 / f;
    var totalTime = period * 3;
    var pixPerSec = W / totalTime;
    var maxV = Math.max(A, 1) * 1.3;
    var pixPerV = (H / 2) / maxV;

    // CH1 — Entrée Ve (jaune)
    ctx.strokeStyle = '#ffee00';
    ctx.lineWidth = 2.5;
    ctx.shadowColor = '#ffee00';
    ctx.shadowBlur = 3;
    ctx.beginPath();
    for (var x = 0; x < W; x++) {
      var v1 = A * Math.sin(w * (x / pixPerSec));
      var y1 = H / 2 - v1 * pixPerV;
      if (x === 0) ctx.moveTo(x, y1); else ctx.lineTo(x, y1);
    }
    ctx.stroke();
    ctx.shadowBlur = 0;

    // CH2 — Sortie Vs filtrée (cyan)
    ctx.strokeStyle = '#00eeff';
    ctx.lineWidth = 2.5;
    ctx.shadowColor = '#00eeff';
    ctx.shadowBlur = 3;
    ctx.beginPath();
    for (var x2 = 0; x2 < W; x2++) {
      var v2 = Aout * Math.sin(w * (x2 / pixPerSec) + phase);
      var y2 = H / 2 - v2 * pixPerV;
      if (x2 === 0) ctx.moveTo(x2, y2); else ctx.lineTo(x2, y2);
    }
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Bandeau info en haut
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, 55);

    ctx.font = 'bold 16px monospace';
    ctx.fillStyle = '#ffee00';
    ctx.fillText('● CH1 Entree : ' + A.toFixed(1) + ' V', 8, 18);
    ctx.fillStyle = '#00eeff';
    ctx.fillText('● CH2 Sortie : ' + Aout.toFixed(2) + ' V', 8, 38);

    ctx.fillStyle = '#ffffff';
    ctx.font = '14px monospace';
    ctx.fillText('f = ' + this._fmtF(f) + '  |  fc = ' + this._fmtF(this.fc), 260, 18);
    ctx.fillText('Gain = ' + gain.toFixed(3) + ' (' + (20 * Math.log10(gain)).toFixed(1) + ' dB)  Phase = ' + (phase * 180 / Math.PI).toFixed(1) + '°', 260, 38);

    // Bandeau info en bas
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, H - 28, W, 28);
    ctx.font = 'bold 13px monospace';
    if (f < this.fc * 0.5) {
      ctx.fillStyle = '#66ff66';
      ctx.fillText('▶ f << fc : le signal passe (bande passante)', 8, H - 10);
    } else if (f > this.fc * 2) {
      ctx.fillStyle = '#ff6666';
      ctx.fillText('▶ f >> fc : le signal est attenue (bande coupee)', 8, H - 10);
    } else {
      ctx.fillStyle = '#ffff66';
      ctx.fillText('▶ f ≈ fc : zone de coupure (-3 dB)', 8, H - 10);
    }

    // Composants
    ctx.fillStyle = '#aaaaaa';
    ctx.font = '11px monospace';
    ctx.fillText('R = ' + (this.R/1000).toFixed(1) + ' kΩ   C = ' + (this.C*1e9).toFixed(0) + ' nF', 350, H - 10);
  },

  _drawGBF: function () {
    var ctx = this.gbfCtx;
    var W = 256, H = 128;

    // Fond avec dégradé
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);

    // Bordure bleue
    ctx.strokeStyle = '#3355cc';
    ctx.lineWidth = 3;
    ctx.strokeRect(2, 2, W - 4, H - 4);

    // Titre
    ctx.font = 'bold 13px monospace';
    ctx.fillStyle = '#5577ee';
    ctx.fillText('GENERATEUR BF', 8, 18);

    // Forme d'onde mini
    ctx.strokeStyle = '#5577ee';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (var x = 160; x < 240; x++) {
      var y = 12 - 6 * Math.sin((x - 160) * Math.PI / 20);
      if (x === 160) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();

    // Séparateur
    ctx.strokeStyle = '#333355';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(8, 26); ctx.lineTo(W - 8, 26); ctx.stroke();

    // Fréquence (gros)
    ctx.font = 'bold 32px monospace';
    ctx.fillStyle = '#ff8844';
    ctx.fillText(this._fmtF(this.freq), 12, 65);

    // Amplitude
    ctx.font = 'bold 22px monospace';
    ctx.fillStyle = '#44ff66';
    ctx.fillText(this.amplitude.toFixed(1) + ' Vpp', 12, 95);

    // Instruction
    ctx.font = '10px monospace';
    ctx.fillStyle = '#666688';
    ctx.fillText('Saisir bouton FREQ ou AMPL', 12, 118);
    ctx.fillText('puis joystick gauche ↑↓', 12, 128);
  },

  _fmtF: function (f) {
    if (f >= 1000) return (f / 1000).toFixed(1) + ' kHz';
    return f.toFixed(0) + ' Hz';
  }
});

// LED clignotante
AFRAME.registerComponent('blink', {
  schema: { speed: { default: 2 } },
  tick: function (t) {
    var on = Math.sin(t * this.data.speed * 0.001 * Math.PI) > 0;
    this.el.setAttribute('material', 'emissive', on ? '#00ff00' : '#002200');
    this.el.setAttribute('material', 'color', on ? '#00ff00' : '#002200');
  }
});
</script>

<a-scene vr-mode-ui="enabled: true" background="color: #1a2030" circuit-sim>

  <!-- ===== ÉCLAIRAGE ===== -->
  <a-light type="ambient" color="#fff" intensity="0.8"></a-light>
  <a-light type="directional" position="1 4 2" intensity="0.6" color="#ffeedd"></a-light>
  <a-light type="point" position="0 3 -2" intensity="1.0" color="#ffffff"></a-light>
  <a-light type="point" position="-1.5 2 -1.5" intensity="0.5" color="#ddeeff"></a-light>
  <a-light type="point" position="1.5 2 -1.5" intensity="0.5" color="#ffeedd"></a-light>

  <!-- ===== SALLE DE TP ===== -->
  <!-- Sol -->
  <a-plane position="0 0 0" rotation="-90 0 0" width="12" height="10" color="#3a4050"
           material="roughness: 0.9"></a-plane>
  <!-- Plafond -->
  <a-plane position="0 3.5 0" rotation="90 0 0" width="12" height="10" color="#2a2a3a"></a-plane>
  <!-- Murs -->
  <a-plane position="0 1.75 -5" width="12" height="3.5" color="#303848"></a-plane>
  <a-plane position="-6 1.75 0" rotation="0 90 0" width="10" height="3.5" color="#303848"></a-plane>
  <a-plane position="6 1.75 0" rotation="0 -90 0" width="10" height="3.5" color="#303848"></a-plane>

  <!-- ===== TABLE DE TP ===== -->
  <!-- Plateau noir (paillasse labo) -->
  <a-box position="0 0.84 -2" width="3.8" height="0.05" depth="1.2" color="#2a2a2a"
         material="roughness: 0.3; metalness: 0.1"></a-box>
  <!-- Bandeau avant de la table (gris) -->
  <a-box position="0 0.6 -1.4" width="3.8" height="0.5" depth="0.04" color="#888888"
         material="roughness: 0.5; metalness: 0.3"></a-box>
  <!-- Pieds métal -->
  <a-cylinder position="-1.8 0.42 -1.5" radius="0.03" height="0.84" color="#888"
              material="metalness: 0.7"></a-cylinder>
  <a-cylinder position="1.8 0.42 -1.5" radius="0.03" height="0.84" color="#888"
              material="metalness: 0.7"></a-cylinder>
  <a-cylinder position="-1.8 0.42 -2.55" radius="0.03" height="0.84" color="#888"
              material="metalness: 0.7"></a-cylinder>
  <a-cylinder position="1.8 0.42 -2.55" radius="0.03" height="0.84" color="#888"
              material="metalness: 0.7"></a-cylinder>

  <!-- ============================================================ -->
  <!--                        GBF                                    -->
  <!-- ============================================================ -->
  <a-entity position="-1.2 0.87 -2.1">
    <!-- Boîtier principal -->
    <a-box width="0.55" height="0.22" depth="0.32" color="#1a1a2a" position="0 0.13 0"
           material="roughness: 0.4; metalness: 0.3"></a-box>
    <!-- Panneau avant (légèrement incliné visuellement) -->
    <a-box width="0.53" height="0.20" depth="0.005" color="#111122" position="0 0.14 0.163"></a-box>

    <!-- Écran GBF -->
    <a-plane id="gbf-screen" width="0.32" height="0.14" position="0 0.18 0.167"
             material="shader: flat; color: #0a0a1a"></a-plane>
    <!-- Contour écran -->
    <a-box width="0.34" height="0.003" depth="0.006" color="#3355cc" position="0 0.252 0.167"></a-box>
    <a-box width="0.34" height="0.003" depth="0.006" color="#3355cc" position="0 0.108 0.167"></a-box>
    <a-box width="0.003" height="0.144" depth="0.006" color="#3355cc" position="-0.17 0.18 0.167"></a-box>
    <a-box width="0.003" height="0.144" depth="0.006" color="#3355cc" position="0.17 0.18 0.167"></a-box>

    <!-- LED power -->
    <a-sphere radius="0.006" position="0.24 0.22 0.167" blink="speed: 0.8"
              material="color: #00ff00; emissive: #00ff00; shader: flat"></a-sphere>

    <!-- ===== BOUTON FRÉQUENCE ===== -->
    <a-entity id="freq-knob" grabbable position="-0.14 0.06 0.167">
      <a-sphere class="interactive" radius="0.06"
                material="opacity: 0.05; transparent: true; side: double"></a-sphere>
      <!-- Bouton physique (gros cylindre orange avec indicateur) -->
      <a-cylinder radius="0.035" height="0.025" color="#dd6622"
                  material="roughness: 0.3; metalness: 0.6" rotation="90 0 0"></a-cylinder>
      <!-- Ligne indicateur sur le bouton -->
      <a-box width="0.003" height="0.025" depth="0.035" color="#ffffff" position="0 0 0"
             material="shader: flat"></a-box>
      <!-- Label sous le bouton -->
      <a-text value="FREQUENCE" position="0 -0.045 0.01" align="center" color="#ff8844"
              width="0.35" font="mozillavr"></a-text>
    </a-entity>
    <!-- Valeur fréquence affichée sous le bouton -->
    <a-text id="freq-label" value="500 Hz" position="-0.14 0.0 0.17" align="center"
            color="#ffaa66" width="0.3"></a-text>

    <!-- ===== BOUTON AMPLITUDE ===== -->
    <a-entity id="amp-knob" grabbable position="0.14 0.06 0.167">
      <a-sphere class="interactive" radius="0.06"
                material="opacity: 0.05; transparent: true; side: double"></a-sphere>
      <a-cylinder radius="0.035" height="0.025" color="#22aa44"
                  material="roughness: 0.3; metalness: 0.6" rotation="90 0 0"></a-cylinder>
      <a-box width="0.003" height="0.025" depth="0.035" color="#ffffff" position="0 0 0"
             material="shader: flat"></a-box>
      <a-text value="AMPLITUDE" position="0 -0.045 0.01" align="center" color="#44ff66"
              width="0.35" font="mozillavr"></a-text>
    </a-entity>
    <a-text id="amp-label" value="5.0 V" position="0.14 0.0 0.17" align="center"
            color="#66ff88" width="0.3"></a-text>

    <!-- Bornes de sortie -->
    <a-cylinder radius="0.01" height="0.02" color="#ff3333" position="-0.08 -0.02 0.17"
                rotation="90 0 0" material="metalness: 0.9"></a-cylinder>
    <a-text value="+" position="-0.08 -0.04 0.17" align="center" color="#ff4444" width="0.15"></a-text>
    <a-cylinder radius="0.01" height="0.02" color="#222222" position="0.08 -0.02 0.17"
                rotation="90 0 0" material="metalness: 0.9"></a-cylinder>
    <a-text value="GND" position="0.08 -0.04 0.17" align="center" color="#aaaaaa" width="0.15"></a-text>

    <!-- Étiquette flottante d'aide -->
    <a-entity position="0 0.42 0.1">
      <a-plane width="0.55" height="0.14" color="#1a3a1a" material="opacity: 0.85"></a-plane>
      <a-text value="SAISIR un bouton (Trigger)\npuis Joystick Gauche haut/bas"
              position="0 0 0.01" align="center" color="#88ff88" width="0.5"
              font="mozillavr"></a-text>
    </a-entity>
  </a-entity>

  <!-- ============================================================ -->
  <!--                   PLATINE D'ESSAI                             -->
  <!-- ============================================================ -->
  <a-entity position="0 0.87 -2.1">
    <!-- Plaque -->
    <a-box width="0.65" height="0.02" depth="0.35" color="#e8e0d0" position="0 0.02 0"
           material="roughness: 0.9"></a-box>
    <!-- Bande centrale -->
    <a-box width="0.63" height="0.003" depth="0.015" color="#888" position="0 0.032 0"></a-box>
    <!-- Rangées de trous -->
    <a-box width="0.60" height="0.002" depth="0.004" color="#bbaa88" position="0 0.032 -0.07"></a-box>
    <a-box width="0.60" height="0.002" depth="0.004" color="#bbaa88" position="0 0.032 -0.04"></a-box>
    <a-box width="0.60" height="0.002" depth="0.004" color="#bbaa88" position="0 0.032 0.04"></a-box>
    <a-box width="0.60" height="0.002" depth="0.004" color="#bbaa88" position="0 0.032 0.07"></a-box>
    <!-- Rails alimentation -->
    <a-box width="0.60" height="0.003" depth="0.012" color="#ff4444" position="0 0.032 0.14"
           material="opacity: 0.7"></a-box>
    <a-box width="0.60" height="0.003" depth="0.012" color="#4444ff" position="0 0.032 -0.14"
           material="opacity: 0.7"></a-box>

    <!-- RÉSISTANCE R = 1 kΩ -->
    <a-entity position="-0.1 0.05 -0.03">
      <a-cylinder radius="0.014" height="0.16" color="#d4c8a0" rotation="0 0 90"
                  material="roughness: 0.7"></a-cylinder>
      <!-- Bandes: marron-noir-rouge-or -->
      <a-cylinder radius="0.015" height="0.01" color="#884411" rotation="0 0 90" position="-0.05 0 0"></a-cylinder>
      <a-cylinder radius="0.015" height="0.01" color="#222222" rotation="0 0 90" position="-0.03 0 0"></a-cylinder>
      <a-cylinder radius="0.015" height="0.01" color="#ff2222" rotation="0 0 90" position="-0.01 0 0"></a-cylinder>
      <a-cylinder radius="0.015" height="0.01" color="#ccaa33" rotation="0 0 90" position="0.03 0 0"></a-cylinder>
      <!-- Pattes -->
      <a-cylinder radius="0.002" height="0.03" color="#aaa" position="-0.1 0 0" rotation="0 0 90"
                  material="metalness: 0.9"></a-cylinder>
      <a-cylinder radius="0.002" height="0.03" color="#aaa" position="0.1 0 0" rotation="0 0 90"
                  material="metalness: 0.9"></a-cylinder>
      <!-- Étiquette -->
      <a-text value="R = 1 kohm" position="0 0.03 0" align="center" color="#ffcc66" width="0.35"></a-text>
    </a-entity>

    <!-- CONDENSATEUR C = 100 nF -->
    <a-entity position="0.12 0.05 0.04">
      <a-cylinder radius="0.018" height="0.012" color="#dd8833" rotation="0 0 0"
                  material="roughness: 0.5"></a-cylinder>
      <a-text value="104" position="0 0.008 0.019" align="center" color="#442200" width="0.12"></a-text>
      <a-cylinder radius="0.002" height="0.05" color="#aaa" position="-0.007 -0.03 0"
                  material="metalness: 0.9"></a-cylinder>
      <a-cylinder radius="0.002" height="0.05" color="#aaa" position="0.007 -0.03 0"
                  material="metalness: 0.9"></a-cylinder>
      <a-text value="C = 100 nF" position="0 0.03 0" align="center" color="#ffcc66" width="0.35"></a-text>
    </a-entity>

    <!-- Label circuit -->
    <a-text value="Filtre RC Passe-Bas" position="0 0.08 0.19" align="center"
            color="#ffffff" width="0.55" font="mozillavr"></a-text>
  </a-entity>

  <!-- ===== FILS DE CONNEXION (plus épais, colorés) ===== -->
  <!-- GBF+ → Résistance (rouge) -->
  <a-cylinder radius="0.005" height="0.5" color="#ee2222" position="-0.62 0.94 -2.0"
              rotation="0 0 90" material="shader: flat"></a-cylinder>
  <!-- Point milieu R-C → Oscillo CH2 (jaune = sortie) -->
  <a-cylinder radius="0.005" height="0.22" color="#eeee22" position="0.02 0.94 -2.03"
              rotation="0 0 90" material="shader: flat"></a-cylinder>
  <!-- C → masse (bleu) -->
  <a-cylinder radius="0.005" height="0.07" color="#2244ee" position="0.12 0.91 -2.06"
              material="shader: flat"></a-cylinder>
  <!-- Masse retour GBF (noir) -->
  <a-cylinder radius="0.005" height="0.5" color="#222222" position="-0.62 0.89 -2.12"
              rotation="0 0 90" material="shader: flat"></a-cylinder>
  <!-- Sortie vers oscillo CH2 (jaune) -->
  <a-cylinder radius="0.005" height="0.65" color="#eeee22" position="0.6 0.94 -2.0"
              rotation="0 0 90" material="shader: flat"></a-cylinder>
  <!-- Entrée vers oscillo CH1 (rouge, depuis avant R) -->
  <a-cylinder radius="0.005" height="0.65" color="#ee2222" position="0.6 0.92 -2.06"
              rotation="0 0 90" material="shader: flat"></a-cylinder>
  <!-- GND vers oscillo (noir) -->
  <a-cylinder radius="0.005" height="0.65" color="#222222" position="0.6 0.89 -2.12"
              rotation="0 0 90" material="shader: flat"></a-cylinder>

  <!-- ============================================================ -->
  <!--                     OSCILLOSCOPE                              -->
  <!-- ============================================================ -->
  <a-entity position="1.2 0.87 -2.1">
    <!-- Boîtier -->
    <a-box width="0.65" height="0.42" depth="0.3" color="#bbb8a8" position="0 0.23 0"
           material="roughness: 0.5; metalness: 0.15"></a-box>
    <!-- Façade noire -->
    <a-box width="0.63" height="0.40" depth="0.005" color="#1a1a1a" position="0 0.24 0.153"></a-box>

    <!-- ÉCRAN OSCILLOSCOPE -->
    <a-plane id="oscillo-screen" width="0.5" height="0.3" position="0 0.28 0.157"
             material="shader: flat; color: #081208"></a-plane>
    <!-- Contour écran vert -->
    <a-box width="0.52" height="0.004" depth="0.006" color="#337733" position="0 0.432 0.155"></a-box>
    <a-box width="0.52" height="0.004" depth="0.006" color="#337733" position="0 0.128 0.155"></a-box>
    <a-box width="0.004" height="0.304" depth="0.006" color="#337733" position="-0.26 0.28 0.155"></a-box>
    <a-box width="0.004" height="0.304" depth="0.006" color="#337733" position="0.26 0.28 0.155"></a-box>

    <!-- Marque -->
    <a-text value="OSCILLOSCOPE NUMERIQUE" position="0 0.46 0.157" align="center"
            color="#aaaaaa" width="0.45" font="mozillavr"></a-text>

    <!-- LED power -->
    <a-sphere radius="0.005" position="0.28 0.08 0.157" blink="speed: 0.5"
              material="color: #00ff00; emissive: #00ff00; shader: flat"></a-sphere>
    <a-text value="ON" position="0.28 0.055 0.157" align="center" color="#aaa" width="0.1"></a-text>

    <!-- Boutons décoratifs -->
    <a-cylinder radius="0.012" height="0.012" color="#666" position="0.2 0.08 0.157"
                rotation="90 0 0" material="metalness: 0.6"></a-cylinder>
    <a-cylinder radius="0.012" height="0.012" color="#666" position="0.14 0.08 0.157"
                rotation="90 0 0" material="metalness: 0.6"></a-cylinder>
    <a-cylinder radius="0.012" height="0.012" color="#666" position="0.08 0.08 0.157"
                rotation="90 0 0" material="metalness: 0.6"></a-cylinder>

    <!-- Bornes d'entrée -->
    <a-cylinder radius="0.01" height="0.015" color="#ffee00" position="-0.18 0.06 0.157"
                rotation="90 0 0" material="metalness: 0.9"></a-cylinder>
    <a-text value="CH1" position="-0.18 0.035 0.157" align="center" color="#ffee00" width="0.15"></a-text>

    <a-cylinder radius="0.01" height="0.015" color="#00eeff" position="-0.08 0.06 0.157"
                rotation="90 0 0" material="metalness: 0.9"></a-cylinder>
    <a-text value="CH2" position="-0.08 0.035 0.157" align="center" color="#00eeff" width="0.15"></a-text>

    <a-cylinder radius="0.01" height="0.015" color="#444444" position="0.02 0.06 0.157"
                rotation="90 0 0" material="metalness: 0.9"></a-cylinder>
    <a-text value="GND" position="0.02 0.035 0.157" align="center" color="#aaaaaa" width="0.15"></a-text>
  </a-entity>

  <!-- ============================================================ -->
  <!--                SCHÉMA DU CIRCUIT (mural)                      -->
  <!-- ============================================================ -->
  <a-entity position="-2.2 2 -4.93">
    <a-plane width="2.4" height="1.6" color="#ffffff" material="opacity: 0.95"></a-plane>
    <a-text value="SCHEMA DU CIRCUIT\nFiltre RC Passe-Bas\n\n         Ve              Vs\n    o────[  R  ]────┬────o\n                    |\n                   [C]\n                    |\n    o───────────────┘\n         GND\n\n  H(jw) = 1 / (1 + jRCw)\n\n  fc = 1/(2.pi.R.C) = 1592 Hz"
           position="0 0.05 0.01" align="center" color="#222" width="2.1"
           font="monoid" line-height="52"></a-text>
  </a-entity>

  <!-- ============================================================ -->
  <!--                  INSTRUCTIONS (mural)                         -->
  <!-- ============================================================ -->
  <a-entity position="2.2 2 -4.93">
    <a-plane width="2.2" height="1.8" color="#1a2a4a" material="opacity: 0.92"></a-plane>
    <a-text value="TP ELECTRONIQUE VR\nMesures Physiques - FEMTO-ST\n\n\nDEPLACEMENT\n  Joystick Gauche : avancer / reculer\n  Joystick Droit  : tourner / monter\n\nREGLAGE DU GBF\n  1. Approcher la main du bouton\n     FREQ (orange) ou AMPL (vert)\n  2. Appuyer sur Trigger ou Grip\n     pour saisir le bouton\n  3. Pousser le Joystick Gauche\n     vers le haut  = augmenter\n     vers le bas   = diminuer\n  4. Relacher pour lacher\n\nOBSERVER L OSCILLOSCOPE\n  CH1 jaune = signal d entree\n  CH2 cyan  = signal de sortie\n  Varier f autour de fc = 1592 Hz"
           position="0 0.05 0.01" align="center" color="#ffffff" width="1.9"
           font="mozillavr" line-height="48"></a-text>
  </a-entity>

  <!-- ============================================================ -->
  <!--         COMPOSANTS DE RECHANGE (sur la table)                 -->
  <!-- ============================================================ -->
  <a-entity grabbable position="-0.5 0.93 -1.55">
    <a-sphere class="interactive" radius="0.06"
              material="opacity: 0.05; transparent: true; side: double"></a-sphere>
    <a-cylinder radius="0.012" height="0.1" color="#d4c8a0" rotation="0 0 90"></a-cylinder>
    <a-cylinder radius="0.013" height="0.006" color="#884411" rotation="0 0 90" position="-0.03 0 0"></a-cylinder>
    <a-cylinder radius="0.013" height="0.006" color="#222222" rotation="0 0 90" position="-0.01 0 0"></a-cylinder>
    <a-cylinder radius="0.013" height="0.006" color="#ff2222" rotation="0 0 90" position="0.01 0 0"></a-cylinder>
    <a-text value="R 1kohm" position="0 -0.03 0" align="center" color="#ffcc66" width="0.25"></a-text>
  </a-entity>

  <a-entity grabbable position="0 0.93 -1.55">
    <a-sphere class="interactive" radius="0.06"
              material="opacity: 0.05; transparent: true; side: double"></a-sphere>
    <a-cylinder radius="0.018" height="0.01" color="#dd8833"></a-cylinder>
    <a-text value="C 100nF" position="0 -0.03 0" align="center" color="#ffcc66" width="0.25"></a-text>
  </a-entity>

  <a-entity grabbable position="0.5 0.93 -1.55">
    <a-sphere class="interactive" radius="0.06"
              material="opacity: 0.05; transparent: true; side: double"></a-sphere>
    <a-cylinder radius="0.022" height="0.04" color="#224488"></a-cylinder>
    <a-text value="C 10uF" position="0 -0.04 0" align="center" color="#88aaff" width="0.25"></a-text>
  </a-entity>

  <!-- ===== RIG (caméra + mains) ===== -->
  <a-entity id="rig" position="0 0 0" locomotion="speed: 2.5">
    <a-camera position="0 1.6 0">
      <a-text id="debug-text" value="Pret." position="0 -0.3 -0.8" align="center"
              color="#ffff00" width="1.2" material="shader: flat"></a-text>
    </a-camera>
    <a-entity id="left-hand" laser-controls="hand: left; model: true">
      <a-sphere class="hand-sphere" radius="0.04" color="#ff4444" material="shader: flat"></a-sphere>
    </a-entity>
    <a-entity id="right-hand" laser-controls="hand: right; model: true">
      <a-sphere class="hand-sphere" radius="0.04" color="#4444ff" material="shader: flat"></a-sphere>
    </a-entity>
  </a-entity>

</a-scene>
</body>
